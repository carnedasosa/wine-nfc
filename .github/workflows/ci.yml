name: Wine NFC checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vino_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/vino_test
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vino_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run check
      - run: npm run test:db
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: output/quality/
